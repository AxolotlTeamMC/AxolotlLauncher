<div class="field-container" [class.has-error]="!!error()">
  <!-- Лейбл теперь просто сверху -->
  @if (label() != undefined) {
    <label class="field-label">{{ label() }}</label>
  }

  <div class="field-wrapper"
       cdkOverlayOrigin
       #trigger="cdkOverlayOrigin"
       (click)="toggle()">

    @if (icon()) {
      <ng-icon class="field-icon" [name]="icon()"></ng-icon>
    }

    <div class="select-value">
      {{ value() }}
    </div>

    <ng-container [ngTemplateOutlet]="isOpen() ? arrowUp : arrowDown"/>
  </div>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen()"
    [cdkConnectedOverlayWidth]="trigger.elementRef.nativeElement.offsetWidth"
    [cdkConnectedOverlayScrollStrategy]="scrollStrategy"
    (overlayOutsideClick)="close()">

    <div class="select-dropdown">
      @for (option of options(); track option.value) {
        <div class="option" (click)="select(option)">
          {{ option.label }}
        </div>
      }
    </div>
  </ng-template>
</div>

<ng-template #arrowDown>
  <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 9 6 6 6-6" />
  </svg>
</ng-template>

<ng-template #arrowUp>
  <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m18 15-6-6-6 6" />
  </svg>
</ng-template>
