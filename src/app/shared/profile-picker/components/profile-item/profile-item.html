<button class="profile-item" [ngClass]="active() ? 'active' : 'inactive'" (click)="selectProfile()">
  <div class="profile-info">
    <div class="avatar" [ngClass]="active() ? 'active' : 'inactive'" >
      <al-minecraft-head></al-minecraft-head>
    </div>
    <div class="user-details">
      <span class="username text-inactive">{{ nickname() }}</span>
      <span class="status">{{ type() }}</span>
    </div>
  </div>
</button>
