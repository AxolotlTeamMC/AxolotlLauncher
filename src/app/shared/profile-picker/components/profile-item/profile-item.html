<button class="profile-item" [ngClass]="active() ? 'active' : 'inactive'" (click)="selectProfile()">
  <div class="profile-info">
    <div class="profile-info-content">
      <div class="avatar" [ngClass]="active() ? 'active' : 'inactive'">
        <al-minecraft-head></al-minecraft-head>
      </div>
      <div class="user-details">
        <span class="username text-inactive">{{ nickname() }}</span>
        <span class="status">{{ type() }}</span>
      </div>
    </div>
    <div class="actions">
      <button class="action-btn" (click)="$event.stopPropagation();">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551" />
        </svg>
      </button>
      <button class="action-btn logout-btn" (click)="$event.stopPropagation(); removeProfile()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>
</button>
